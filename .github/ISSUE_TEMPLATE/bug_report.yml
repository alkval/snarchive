name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not upload personal exports, photos, GPS metadata, signed links, credentials or signing keys. Use SECURITY.md for vulnerabilities."
  - type: input
    id: version
    attributes:
      label: App version or source commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Android version, device or emulator, and storage provider
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe a synthetic fixture or structural example, and the exact steps.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Checks and supporting evidence
      description: Separate host, emulator and physical-device results. Remove identifying data from screenshots and logs.
